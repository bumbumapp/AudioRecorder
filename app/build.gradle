apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
// google-services.json is not committed to this repo. Firebase plugins are applied only when the
// file is present (add it before building the Play release so Crashlytics/Analytics work).
if (file('google-services.json').exists()) {
	apply plugin: 'com.google.gms.google-services'
	apply plugin: 'com.google.firebase.crashlytics'
}

def versionMajor = 0
def versionMinor = 9
def versionPatch = 33

android {
	namespace 'com.dimowner.audiorecorder'
	compileSdk 36
	defaultConfig {
		applicationId "com.bumbumapps.audiorecorderpro"
		minSdk 24
		targetSdk 36
		versionCode 11
		versionName "1.3.0"
	}

	buildFeatures {
		viewBinding true
		buildConfig true
	}


	buildTypes {
		release {
			// Real AdMob IDs (AdMob app "Audio Recorder pro").
			resValue 'string', 'banner_app_id', 'ca-app-pub-8444865753152507~7775906839'
			resValue 'string', 'banner_id', 'ca-app-pub-8444865753152507/7160280427'
			resValue 'string', 'interstial_id', 'ca-app-pub-8444865753152507/2423244479'
			minifyEnabled true
			shrinkResources true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
//			firebaseCrashlytics {
//				mappingFileUploadEnabled true
//			}
		}
		debug {
			// Google's public test IDs so debug builds never request real ads.
			resValue 'string', 'banner_app_id', 'ca-app-pub-3940256099942544~3347511713'
			resValue 'string', 'banner_id', 'ca-app-pub-3940256099942544/9214589741'
			resValue 'string', 'interstial_id', 'ca-app-pub-3940256099942544/1033173712'
			minifyEnabled false
		}
	}





	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
	kotlinOptions {
		jvmTarget = '17'
	}

	lint {
		abortOnError false
		checkReleaseBuilds false
	}
}


dependencies {
	//Kotlin
	implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
	implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"

	//Timber
	implementation "com.jakewharton.timber:timber:5.0.1"
	implementation "androidx.core:core:1.17.0"
	implementation "androidx.recyclerview:recyclerview:1.4.0"
	implementation "androidx.viewpager2:viewpager2:1.1.0"

	//ads
	implementation 'com.google.android.gms:play-services-ads:25.5.0'
	implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

	implementation platform('com.google.firebase:firebase-bom:35.1.0')
	implementation 'com.google.firebase:firebase-crashlytics'
	implementation 'com.google.firebase:firebase-analytics'

	testImplementation 'junit:junit:4.13.2'
}
