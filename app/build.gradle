apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Huawei Ads (Petal) slot IDs for the AppGallery build: -PHMS_BANNER_ID=... or ads.properties.
// Until the real slots are set the hms build falls back to Huawei's public test slots.
def hmsAdsProps = new Properties()
def hmsAdsPropsFile = rootProject.file('ads.properties')
if (hmsAdsPropsFile.exists()) hmsAdsPropsFile.withInputStream { hmsAdsProps.load(it) }
def hmsAdId = { String key, String fallback -> ((project.findProperty(key) ?: hmsAdsProps.getProperty(key)) ?: fallback).toString() }
def HMS_TEST_BANNER_ID = 'testw6vs28auh3'
def HMS_TEST_INTERSTITIAL_ID = 'testb4znbuh3n2'
def HMS_BANNER_ID = hmsAdId('HMS_BANNER_ID', 'e3oqb6ggj8')
def HMS_INTERSTITIAL_ID = hmsAdId('HMS_INTERSTITIAL_ID', 'k6s0ov3auo')
// google-services.json is not committed to this repo. Firebase plugins are applied only when the
// file is present (add it before building the Play release so Crashlytics/Analytics work).
if (file('google-services.json').exists()) {
	apply plugin: 'com.google.gms.google-services'
	apply plugin: 'com.google.firebase.crashlytics'
}

def versionMajor = 0
def versionMinor = 9
def versionPatch = 33

android {
	namespace 'com.dimowner.audiorecorder'
	compileSdk 36
	defaultConfig {
		applicationId "com.bumbumapps.audiorecorderpro"
		minSdk 24
		targetSdk 36
		versionCode 13
		versionName "2.0.1"
	}

	buildFeatures {
		viewBinding true
		buildConfig true
	}


	// play = Google Play (AdMob + UMP), hms = Huawei AppGallery (Huawei Ads, no Google Mobile Services).
	flavorDimensions = ['store']
	productFlavors {
		play {
			dimension 'store'
		}
		hms {
			dimension 'store'
			resValue 'string', 'hms_banner_id', HMS_BANNER_ID
			resValue 'string', 'hms_interstitial_id', HMS_INTERSTITIAL_ID
			resValue 'string', 'hms_test_banner_id', HMS_TEST_BANNER_ID
			resValue 'string', 'hms_test_interstitial_id', HMS_TEST_INTERSTITIAL_ID
		}
	}

	buildTypes {
		release {
			// Real AdMob IDs (AdMob app "Audio Recorder pro").
			resValue 'string', 'banner_app_id', 'ca-app-pub-8444865753152507~7775906839'
			resValue 'string', 'banner_id', 'ca-app-pub-8444865753152507/7160280427'
			resValue 'string', 'interstial_id', 'ca-app-pub-8444865753152507/2423244479'
			minifyEnabled true
			shrinkResources true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
//			firebaseCrashlytics {
//				mappingFileUploadEnabled true
//			}
		}
		debug {
			// Google's public test IDs so debug builds never request real ads.
			resValue 'string', 'banner_app_id', 'ca-app-pub-3940256099942544~3347511713'
			resValue 'string', 'banner_id', 'ca-app-pub-3940256099942544/9214589741'
			resValue 'string', 'interstial_id', 'ca-app-pub-3940256099942544/1033173712'
			minifyEnabled false
		}
	}





	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
	kotlinOptions {
		jvmTarget = '17'
	}

	lint {
		abortOnError false
		checkReleaseBuilds false
	}
}


dependencies {
	//Kotlin
	implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
	implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"

	//Timber
	implementation "com.jakewharton.timber:timber:5.0.1"
	implementation "androidx.core:core:1.17.0"
	implementation "androidx.appcompat:appcompat:1.7.1"
	implementation "com.google.android.material:material:1.13.0"
	implementation "androidx.recyclerview:recyclerview:1.4.0"
	implementation "androidx.viewpager2:viewpager2:1.1.0"

	//ads
	playImplementation 'com.google.android.gms:play-services-ads:25.5.0'
	playImplementation 'com.google.android.ump:user-messaging-platform:4.0.0'
	hmsImplementation 'com.huawei.hms:ads-lite:13.4.91.301'

	implementation platform('com.google.firebase:firebase-bom:35.1.0')
	implementation 'com.google.firebase:firebase-crashlytics'
	// Not called from code; it pulls Google ad-ID classes and needs GMS, so only the Play build ships it.
	playImplementation 'com.google.firebase:firebase-analytics'

	testImplementation 'junit:junit:4.13.2'
}
